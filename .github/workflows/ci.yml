name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coinvault_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Tests on SQLite
        run: pytest
      - name: Tests on PostgreSQL 16
        run: pytest
        env:
          CV_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/coinvault_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend (the end-to-end tests run against it)
        working-directory: backend
        run: python -m venv .venv && .venv/bin/pip install -e .
      - name: Install frontend
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: End-to-end tests
        working-directory: frontend
        run: npx playwright test
