[project]
name = "coin-vault"
version = "0.2.0"
description = "Self-hosted inventory and valuation for a precious-metals and coin collection"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "piexif>=1.1.3",
    "imagehash>=4.3",
    "numpy>=1.26",
    "filetype>=1.2",
    "structlog>=24.1",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
