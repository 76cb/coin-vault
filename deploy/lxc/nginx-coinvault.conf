# /etc/nginx/sites-available/coinvault  (installed by deploy/lxc/install.sh)
# Plain http for a private LAN. Do not expose this to the internet; see README.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/coinvault/app/frontend/dist;
    index index.html;

    # Bulk photo uploads can be large (up to 200 files per batch).
    client_max_body_size 1024m;
    client_body_timeout 300s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # Photos and documents: the app checks the session, then nginx sends the file.
    location /protected-media/ {
        internal;
        alias /var/lib/coinvault/media/;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
